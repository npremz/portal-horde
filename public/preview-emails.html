<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview Emails - Horde Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #fff;
      min-height: 100vh;
    }
    .header {
      background: #222;
      padding: 24px 32px;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 2px;
    }
    .header p {
      color: #888;
      margin-top: 4px;
      font-size: 14px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .tab {
      padding: 8px 16px;
      background: #333;
      border: none;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .tab:hover {
      background: #444;
    }
    .tab.active {
      background: #fff;
      color: #222;
    }
    .preview-container {
      padding: 32px;
      display: flex;
      justify-content: center;
    }
    .email-frame {
      display: none;
      width: 100%;
      max-width: 640px;
      background: #f8f8f8;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .email-frame.active {
      display: block;
    }
    .email-content {
      width: 100%;
    }
    .device-toggle {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }
    .device-btn {
      padding: 6px 12px;
      background: transparent;
      border: 1px solid #444;
      color: #888;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .device-btn.active {
      border-color: #fff;
      color: #fff;
    }
    .mobile-view .email-frame {
      max-width: 375px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>HORDE EMAIL PREVIEW</h1>
    <p>Prévisualisation des templates d'emails</p>
    <div style="display: flex; align-items: center; margin-top: 16px;">
      <div class="tabs">
        <button class="tab active" data-tab="welcome">Bienvenue</button>
        <button class="tab" data-tab="pending">Nouveau livrable</button>
        <button class="tab" data-tab="validated">Validé</button>
        <button class="tab" data-tab="revision">Révision</button>
        <button class="tab" data-tab="comment">Commentaire</button>
      </div>
      <div class="device-toggle">
        <button class="device-btn active" data-device="desktop">Desktop</button>
        <button class="device-btn" data-device="mobile">Mobile</button>
      </div>
    </div>
  </div>

  <div class="preview-container" id="preview">
    <!-- Welcome Email -->
    <div class="email-frame active" id="welcome">
      <div class="email-content">
        <!-- Email content injected below -->
      </div>
    </div>

    <!-- Pending Review Email -->
    <div class="email-frame" id="pending">
      <div class="email-content"></div>
    </div>

    <!-- Validated Email -->
    <div class="email-frame" id="validated">
      <div class="email-content"></div>
    </div>

    <!-- Revision Email -->
    <div class="email-frame" id="revision">
      <div class="email-content"></div>
    </div>

    <!-- Comment Email -->
    <div class="email-frame" id="comment">
      <div class="email-content"></div>
    </div>
  </div>

  <script>
    // Brand colors
    const brandColors = {
      primary: "#222121",
      primaryLight: "#4c4b4b",
      background: "#f8f8f8",
      white: "#ffffff",
      border: "#e5e5e5",
      muted: "#6b7280",
      yellow: { bg: "#fef3c7", text: "#92400e", border: "#fcd34d" },
      green: { bg: "#d1fae5", text: "#065f46", border: "#6ee7b7" },
      red: { bg: "#fee2e2", text: "#991b1b", border: "#fca5a5" },
      blue: { bg: "#dbeafe", text: "#1e40af", border: "#93c5fd" },
    };

    function createButton(text, url, variant = "primary") {
      const bgColor = variant === "primary" ? brandColors.primary : brandColors.white;
      const textColor = variant === "primary" ? brandColors.white : brandColors.primary;
      const border = variant === "primary" ? "none" : `2px solid ${brandColors.border}`;

      return `
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin: 24px 0 8px;">
          <tr>
            <td align="center" style="border-radius: 8px; background-color: ${bgColor}; border: ${border};">
              <a href="${url}" target="_blank" class="button" style="display: inline-block; padding: 14px 32px; font-size: 14px; font-weight: 600; color: ${textColor}; text-decoration: none;">
                ${text}
              </a>
            </td>
          </tr>
        </table>
      `;
    }

    function createBadge(text, color) {
      const colors = brandColors[color];
      return `
        <span style="display: inline-block; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; background-color: ${colors.bg}; color: ${colors.text}; border: 1px solid ${colors.border};">
          ${text}
        </span>
      `;
    }

    function createInfoRow(label, value) {
      return `
        <tr>
          <td style="padding: 8px 0; border-bottom: 1px solid ${brandColors.border};">
            <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
              <tr>
                <td style="font-size: 13px; color: ${brandColors.muted}; width: 100px;">${label}</td>
                <td style="font-size: 13px; color: ${brandColors.primary}; font-weight: 500;">${value}</td>
              </tr>
            </table>
          </td>
        </tr>
      `;
    }

    function wrapTemplate(content) {
      return `
        <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color: ${brandColors.background};">
          <tr>
            <td align="center" style="padding: 40px 16px;">
              <table role="presentation" cellpadding="0" cellspacing="0" width="520" class="container" style="max-width: 520px; background-color: ${brandColors.white}; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
                <tr>
                  <td align="center" style="padding: 32px 24px; background-color: ${brandColors.primary};">
                    <table role="presentation" cellpadding="0" cellspacing="0">
                      <tr>
                        <td style="font-size: 24px; font-weight: 700; letter-spacing: 4px; color: ${brandColors.white};">
                          HORDE
                        </td>
                      </tr>
                      <tr>
                        <td style="font-size: 11px; letter-spacing: 2px; color: rgba(255,255,255,0.7); padding-top: 4px;">
                          PORTAIL CLIENT
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                ${content}
                <tr>
                  <td style="padding: 24px; background-color: ${brandColors.background}; border-top: 1px solid ${brandColors.border};">
                    <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                      <tr>
                        <td align="center" style="font-size: 12px; color: ${brandColors.muted}; line-height: 1.5;">
                          <p style="margin: 0;">Horde Agence Web</p>
                          <p style="margin: 4px 0 0;">Bruxelles, Belgique</p>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
              <table role="presentation" cellpadding="0" cellspacing="0" width="520" style="max-width: 520px;">
                <tr>
                  <td align="center" style="padding: 24px;">
                    <a href="#" style="font-size: 12px; color: ${brandColors.muted}; text-decoration: none;">
                      portal.hordeagence.com
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      `;
    }

    // Welcome Email
    const welcomeContent = `
      <tr>
        <td class="content" style="padding: 40px 32px;">
          <h1 style="margin: 0 0 16px; font-size: 24px; font-weight: 700; color: ${brandColors.primary}; line-height: 1.3;">
            Bienvenue sur votre espace projet
          </h1>
          <p style="margin: 0 0 24px; font-size: 15px; color: ${brandColors.primaryLight}; line-height: 1.6;">
            Bonjour Jean Dupont,<br><br>
            Votre espace client Horde est prêt ! Vous pouvez maintenant suivre l'avancement de votre projet <strong>Site E-commerce Luxe</strong> en temps réel.
          </p>
        </td>
      </tr>
      <tr>
        <td style="padding: 0 32px 32px;">
          <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color: ${brandColors.background}; border-radius: 8px;">
            <tr>
              <td style="padding: 24px;">
                <p style="margin: 0 0 16px; font-size: 13px; font-weight: 600; color: ${brandColors.muted}; text-transform: uppercase; letter-spacing: 1px;">
                  Ce que vous pouvez faire
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                  <tr><td style="padding: 8px 0; font-size: 14px; color: ${brandColors.primaryLight};"><span style="color: ${brandColors.green.text}; margin-right: 8px;">✓</span>Suivre l'avancement étape par étape</td></tr>
                  <tr><td style="padding: 8px 0; font-size: 14px; color: ${brandColors.primaryLight};"><span style="color: ${brandColors.green.text}; margin-right: 8px;">✓</span>Télécharger et valider les livrables</td></tr>
                  <tr><td style="padding: 8px 0; font-size: 14px; color: ${brandColors.primaryLight};"><span style="color: ${brandColors.green.text}; margin-right: 8px;">✓</span>Communiquer via les commentaires</td></tr>
                  <tr><td style="padding: 8px 0; font-size: 14px; color: ${brandColors.primaryLight};"><span style="color: ${brandColors.green.text}; margin-right: 8px;">✓</span>Recevoir des notifications en temps réel</td></tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td align="center" style="padding: 0 32px 40px;">
          ${createButton("Accéder à mon espace", "#")}
          <p style="margin: 16px 0 0; font-size: 13px; color: ${brandColors.muted};">
            Pas de mot de passe requis — un lien magique vous sera envoyé
          </p>
        </td>
      </tr>
    `;

    // Pending Review Email
    const pendingContent = `
      <tr>
        <td class="content" style="padding: 40px 32px 24px;">
          <p style="margin: 0 0 8px;">
            ${createBadge("Nouveau livrable", "yellow")}
          </p>
          <h1 style="margin: 16px 0; font-size: 22px; font-weight: 700; color: ${brandColors.primary}; line-height: 1.3;">
            Un livrable attend votre validation
          </h1>
          <p style="margin: 0; font-size: 15px; color: ${brandColors.primaryLight}; line-height: 1.6;">
            Bonjour Jean Dupont,<br><br>
            Un nouveau livrable est prêt pour votre validation sur le projet <strong>Site E-commerce Luxe</strong>.
          </p>
        </td>
      </tr>
      <tr>
        <td style="padding: 0 32px 32px;">
          <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color: ${brandColors.background}; border-radius: 8px; border-left: 4px solid ${brandColors.yellow.border};">
            <tr>
              <td style="padding: 20px 24px;">
                <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                  ${createInfoRow("Projet", "Site E-commerce Luxe")}
                  ${createInfoRow("Étape", "Maquette")}
                  ${createInfoRow("Livrable", "Maquette page d'accueil")}
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td class="content" style="padding: 0 32px 40px;">
          <p style="margin: 0 0 8px; font-size: 14px; color: ${brandColors.primaryLight}; line-height: 1.6;">
            Consultez les fichiers, laissez vos commentaires et validez directement depuis le portail.
          </p>
          ${createButton("Voir le livrable", "#")}
        </td>
      </tr>
    `;

    // Validated Email
    const validatedContent = `
      <tr>
        <td class="content" style="padding: 40px 32px 24px;">
          <p style="margin: 0 0 8px;">
            ${createBadge("Validé", "green")}
          </p>
          <h1 style="margin: 16px 0; font-size: 22px; font-weight: 700; color: ${brandColors.primary}; line-height: 1.3;">
            Jean Dupont a validé le livrable
          </h1>
          <p style="margin: 0; font-size: 15px; color: ${brandColors.primaryLight}; line-height: 1.6;">
            Bonjour Nicolas,<br><br>
            <strong>Jean Dupont</strong> a validé le livrable <strong>Maquette page d'accueil</strong>.
          </p>
        </td>
      </tr>
      <tr>
        <td style="padding: 0 32px 32px;">
          <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color: ${brandColors.background}; border-radius: 8px; border-left: 4px solid ${brandColors.green.border};">
            <tr>
              <td style="padding: 20px 24px;">
                <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                  ${createInfoRow("Projet", "Site E-commerce Luxe")}
                  ${createInfoRow("Étape", "Maquette")}
                  ${createInfoRow("Livrable", "Maquette page d'accueil")}
                  ${createInfoRow("Client", "Jean Dupont")}
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td class="content" style="padding: 0 32px 40px;">
          <p style="margin: 0 0 8px; font-size: 14px; color: ${brandColors.primaryLight}; line-height: 1.6;">
            Le livrable a été validé. Vous pouvez passer à la suite !
          </p>
          ${createButton("Voir le livrable", "#")}
        </td>
      </tr>
    `;

    // Revision Email
    const revisionContent = `
      <tr>
        <td class="content" style="padding: 40px 32px 24px;">
          <p style="margin: 0 0 8px;">
            ${createBadge("Révision demandée", "red")}
          </p>
          <h1 style="margin: 16px 0; font-size: 22px; font-weight: 700; color: ${brandColors.primary}; line-height: 1.3;">
            Jean Dupont demande une révision
          </h1>
          <p style="margin: 0; font-size: 15px; color: ${brandColors.primaryLight}; line-height: 1.6;">
            Bonjour Nicolas,<br><br>
            <strong>Jean Dupont</strong> a demandé une révision sur le livrable <strong>Maquette page d'accueil</strong>.
          </p>
        </td>
      </tr>
      <tr>
        <td style="padding: 0 32px 32px;">
          <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color: ${brandColors.background}; border-radius: 8px; border-left: 4px solid ${brandColors.red.border};">
            <tr>
              <td style="padding: 20px 24px;">
                <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                  ${createInfoRow("Projet", "Site E-commerce Luxe")}
                  ${createInfoRow("Étape", "Maquette")}
                  ${createInfoRow("Livrable", "Maquette page d'accueil")}
                  ${createInfoRow("Client", "Jean Dupont")}
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td class="content" style="padding: 0 32px 40px;">
          <p style="margin: 0 0 8px; font-size: 14px; color: ${brandColors.primaryLight}; line-height: 1.6;">
            Des modifications sont demandées. Consultez les commentaires du client pour plus de détails.
          </p>
          ${createButton("Voir le livrable", "#")}
        </td>
      </tr>
    `;

    // Comment Email
    const commentContent = `
      <tr>
        <td class="content" style="padding: 40px 32px 24px;">
          <p style="margin: 0 0 8px;">
            ${createBadge("Nouveau commentaire", "blue")}
          </p>
          <h1 style="margin: 16px 0; font-size: 22px; font-weight: 700; color: ${brandColors.primary}; line-height: 1.3;">
            Jean Dupont a commenté
          </h1>
          <p style="margin: 0; font-size: 15px; color: ${brandColors.primaryLight}; line-height: 1.6;">
            Bonjour Nicolas,<br><br>
            Un nouveau commentaire a été ajouté sur le livrable <strong>Maquette page d'accueil</strong> du projet <strong>Site E-commerce Luxe</strong>.
          </p>
        </td>
      </tr>
      <tr>
        <td style="padding: 0 32px 32px;">
          <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color: ${brandColors.background}; border-radius: 8px;">
            <tr>
              <td style="padding: 20px 24px;">
                <p style="margin: 0 0 8px; font-size: 12px; font-weight: 600; color: ${brandColors.muted};">
                  Jean Dupont a écrit :
                </p>
                <p style="margin: 0; font-size: 14px; color: ${brandColors.primaryLight}; font-style: italic; line-height: 1.6;">
                  "Super travail sur la maquette ! J'aimerais juste qu'on ajuste légèrement la couleur du header, elle me semble un peu trop foncée. Peut-on essayer avec un gris plus clair ?"
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td align="center" style="padding: 0 32px 40px;">
          ${createButton("Voir la conversation", "#")}
        </td>
      </tr>
    `;

    // Inject emails
    document.getElementById('welcome').querySelector('.email-content').innerHTML = wrapTemplate(welcomeContent);
    document.getElementById('pending').querySelector('.email-content').innerHTML = wrapTemplate(pendingContent);
    document.getElementById('validated').querySelector('.email-content').innerHTML = wrapTemplate(validatedContent);
    document.getElementById('revision').querySelector('.email-content').innerHTML = wrapTemplate(revisionContent);
    document.getElementById('comment').querySelector('.email-content').innerHTML = wrapTemplate(commentContent);

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.email-frame').forEach(f => f.classList.remove('active'));

        tab.classList.add('active');
        document.getElementById(tab.dataset.tab).classList.add('active');
      });
    });

    // Device toggle
    document.querySelectorAll('.device-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        if (btn.dataset.device === 'mobile') {
          document.getElementById('preview').classList.add('mobile-view');
        } else {
          document.getElementById('preview').classList.remove('mobile-view');
        }
      });
    });
  </script>
</body>
</html>
